version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: monthly
    groups:
      spring:
        patterns: ['org.springframework*']
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    groups:
      angular:
        patterns: ['@angular*', '@angular/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly
