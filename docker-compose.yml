# Stack complète : PostgreSQL + API Spring Boot + front Angular servi par nginx.
#   docker compose up --build
#   → http://localhost:8088 (application), http://localhost:8080/swagger-ui.html (API)
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creneau
      POSTGRES_USER: creneau
      POSTGRES_PASSWORD: creneau
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U creneau -d creneau']
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/creneau
      SPRING_DATASOURCE_USERNAME: creneau
      SPRING_DATASOURCE_PASSWORD: creneau
      # À remplacer hors démo : openssl rand -base64 32
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWNyZW5lYXUtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24hIQ==}
    ports:
      - '8080:8080'
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - '8088:80'
    depends_on:
      - api

volumes:
  db-data:
